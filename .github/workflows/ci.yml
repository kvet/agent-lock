name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Tests use Swift Testing, which needs a Swift 6 toolchain (Xcode 16+).
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Build (release)
        run: swift build -c release
      - name: Test
        run: swift test
      - name: Smoke test the release binary
        run: |
          export AGENT_LOCK_DIR="$RUNNER_TEMP/agent-lock"
          .build/release/agent-lock version
          .build/release/agent-lock shared -- true
          .build/release/agent-lock status --json

  build-swift-5:
    # The package declares swift-tools-version 5.9; make sure it still builds there.
    name: Build with Swift 5.10 (macos-14)
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build -c release

  build-clt-only:
    # Homebrew users may have only the Command Line Tools, not full Xcode.
    name: Build with Command Line Tools only
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build with DEVELOPER_DIR pointing at the CLT
        run: |
          if [ ! -d /Library/Developer/CommandLineTools/usr/bin ]; then
            echo "::warning::Command Line Tools are not installed on this runner; skipping"
            exit 0
          fi
          export DEVELOPER_DIR=/Library/Developer/CommandLineTools
          swift --version
          swift build -c release --disable-sandbox
